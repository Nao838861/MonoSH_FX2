MEMORY {
  BOOT: start=$008000, size=$7FB0, file=%O, fill=yes, fillval=$EA;
  HEADER: start=$00FFB0, size=$50, file=%O, fill=yes;
  GSU: start=$018000, size=$8000, file=%O, fill=yes;
  PIXELS: start=$410000, size=$10000, file=%O, fill=yes;
  RUNS: start=$420000, size=$10000, file=%O, fill=yes;
  BOUNDS: start=$430000, size=$10000, file=%O, fill=yes;
  PACKED: start=$440000, size=$10000, file=%O, fill=yes;
  PAD: start=$450000, size=$30000, file=%O, fill=yes;
  WRAM: start=$7E0000, size=$1000, file="";
}
SEGMENTS {
  BOOT: load=BOOT, type=ro;
  WRAM: load=BOOT, run=WRAM, type=ro, define=yes;
  HEADER: load=HEADER, type=ro;
  GSU: load=GSU, type=ro, align=$10;
  PIXELS: load=PIXELS, type=ro;
  RUNS: load=RUNS, type=ro;
  BOUNDS: load=BOUNDS, type=ro;
  PACKED: load=PACKED, type=ro;
}
